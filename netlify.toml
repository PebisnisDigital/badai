# BADAI Netlify production mirror
[build]
  command = "npm run netlify:build"
  publish = "netlify-public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# BADAI shared Railway backend proxies
[[redirects]]
  from = "/api/mentor/*"
  to = "https://badai.up.railway.app/api/mentor/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/community/*"
  to = "https://badai.up.railway.app/api/community/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile/*"
  to = "https://badai.up.railway.app/api/profile/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/ai/*"
  to = "https://badai.up.railway.app/api/admin/ai/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/mentor-identity/avatar"
  to = "https://badai.up.railway.app/api/admin/mentor-identity/avatar"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/chat/permanent-delete"
  to = "https://badai.up.railway.app/api/admin/chat/permanent-delete"
  status = 200
  force = true
